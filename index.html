<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="engrenagem.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
    <main>
        <section id="login">
            <div id="imagemlogin">
            </div>
            <div id="entradas">
                <h1>Site de serviços informais</h1>
                <p>O seu site de trabalhos da comunidade regional</p>
                <form action="null">
                    <div class="email">
                        <span>&#9993</span>
                        <input type="email" name="email" id="idemail" placeholder="exemplo@xxxx.com" maxlength="20" required>
                    </div>
                    <div class="senha">
                        <span>&#128477</span>
                        <input type="password" name="senha" id="idsenha" placeholder="Mínimo de 8 dígitos" minlength="8" maxlength="15" required>
                    </div>
                    <input type="submit" value="acessar">
                    <p>Ainda não tem login? <a href="cadastro.html">Cadastre-se</a></p>
                    <a href="recuperarsenha.html">Esqueci a senha</a>
                </form>
            </div>
        </section>
    </main>
    <footer>
    </footer>
</body>
</html>
