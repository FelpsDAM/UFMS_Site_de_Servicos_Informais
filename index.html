<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="shortcut icon" href="engrenagem.ico" type="image/x-icon">
        <link rel="stylesheet" href="style.css">
        <title>Login | Serviços Informais</title>
    </head>
    <body>
        <main class="centralizar">
            <!--Box principal do login-->
            <div class="area-login">
                <h1 class="titulo-principal">Serviços Informais</h1>

                <!--Sessão campos do login-->
                <section class="cabecalho">
                    <header>
                        <h2 class="titulo-login">Login</h2>
                    </header>

                    <!--Formulário com entradas-->
                    <form class="formulario" action="#" method="post">

                        <!--Usuário-->
                        <div class="campo-formulario">
                            <label class="campo" for="usuario">
                                <span class="campo-obrigatorio">*</span>Login:
                            </label>
                            <input class="inserir" type="text" id="usuario" name="usuario" placeholder="Seu usuário" required>
                        </div>

                        <!--Senha-->
                        <div class="campo-formulario">
                            <label class="campo" for="senha">
                                <span class="campo-obrigatorio">*</span>Senha:
                            </label>
                            <input class="inserir" type="password" name="senha" id="senha" placeholder="Senha mínima com 6 dígitos" minlength="6" required>
                        </div>

                        <!--Botão de entrada e opções-->
                        <div class="entrar">
                            <a class="logar" href="servicos.html">Iniciar</a>
                        </div>
                    </form>
                </section>

                <p class="opcoes-login">
                    Clique aqui para <a href="cadastro.html">criar</a> uma conta 
                </p>
            </div>

        </main>
    </body>
</html>
